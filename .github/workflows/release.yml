# Builds and publishes a release whenever a pull request is merged into master:
#   - one platform-restricted "fat" jar per OS (Linux x86_64, Windows x86_64, macOS arm64)
#   - a macOS pokecard.app app image
#   - a Windows pokecard app image (zipped; run pokecard.exe)
#   - Fedora/RHEL .rpm and Debian/Ubuntu .deb packages
#   - an Arch Linux .pkg.tar.zst (pacman) package
# The rpm is then published to a small DNF/YUM repository hosted on GitHub Pages.
#
# This workflow uses actions that are not certified by GitHub. They are
# provided by third parties and governed by separate terms of service,
# privacy policy, and support documentation.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    ##if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read project version from pom.xml
        id: version
        run: echo "version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"

      - name: Fail if this version was already released
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::v${{ steps.version.outputs.version }} already has a release. Bump <version> in pom.xml before merging to master."
            exit 1
          fi

  # One lean jar per platform. -Djavacpp.platform prunes OpenCV natives to a
  # single OS; JavaFX natives are pruned automatically by building on the
  # matching native runner.
  build-jars:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            label: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
            label: windows-x86_64
          - os: macos-latest        # macos-latest is Apple Silicon (arm64)
            platform: macosx-arm64
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build platform-restricted jar
        shell: bash
        run: mvn -B clean package "-Djavacpp.platform=${{ matrix.platform }}" --file pom.xml

      - name: Name the jar for its platform
        shell: bash
        run: |
          cp target/pokecard-${{ needs.check-version.outputs.version }}.jar \
             pokecard-${{ needs.check-version.outputs.version }}-${{ matrix.label }}.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-jar-${{ matrix.label }}
          path: pokecard-${{ needs.check-version.outputs.version }}-${{ matrix.label }}.jar

  build-macos-app:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar with Maven
        run: mvn -B clean package -Djavacpp.platform=macosx-arm64 --file pom.xml

      - name: Package pokecard.app with jpackage
        run: |
          jpackage \
            --type app-image \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version 1.0 \
            --vendor willtryon

      - name: Zip the app bundle
        run: cd dist && zip -r -X pokecard-${{ needs.check-version.outputs.version }}-macos.zip pokecard.app

      - name: Upload app-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-macos-app
          path: dist/pokecard-${{ needs.check-version.outputs.version }}-macos.zip

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar with Maven
        shell: bash
        run: mvn -B clean package -Djavacpp.platform=windows-x86_64 --file pom.xml

      - name: Package app image with jpackage
        run: |                       # pwsh: line continuation is a backtick, not a backslash
          jpackage `
            --type app-image `
            --input target `
            --dest dist `
            --name pokecard `
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar `
            --main-class com.willtryon.pokecard.gui.Launcher `
            --app-version ${{ needs.check-version.outputs.version }} `
            --vendor willtryon

      - name: Zip the app image
        run: Compress-Archive -Path dist/pokecard -DestinationPath dist/pokecard-${{ needs.check-version.outputs.version }}-windows.zip

      - name: Upload windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-windows-app
          path: dist/pokecard-${{ needs.check-version.outputs.version }}-windows.zip

  # Builds the jar once, then emits both .rpm and .deb from it.
  build-linux-packages:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install rpm + deb packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c fakeroot

      - name: Build jar with Maven
        run: mvn -B clean package -Djavacpp.platform=linux-x86_64 --file pom.xml

      - name: Package .rpm with jpackage
        run: |
          jpackage \
            --type rpm \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version ${{ needs.check-version.outputs.version }} \
            --vendor willtryon \
            --linux-package-name pokecard \
            --description "Pokecard - Pokemon card scanning and collection tool"

      - name: Package .deb with jpackage
        run: |
          jpackage \
            --type deb \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version ${{ needs.check-version.outputs.version }} \
            --vendor willtryon \
            --linux-package-name pokecard \
            --description "Pokecard - Pokemon card scanning and collection tool"

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-rpm
          path: dist/*.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-deb
          path: dist/*.deb

  build-arch:
    needs: [check-version, build-jars]
    runs-on: ubuntu-latest
    steps:
      - name: Download linux-x86_64 jar
        uses: actions/download-artifact@v5
        with:
          name: pokecard-jar-linux-x86_64
          path: arch

      - name: Assemble packaging files
        run: |
          cd arch
          mv pokecard-*-linux-x86_64.jar pokecard.jar

          printf '%s\n' '#!/bin/sh' 'exec java -jar /usr/share/java/pokecard/pokecard.jar "$@"' > pokecard.sh

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Pokecard' \
            'Comment=Pokemon card scanning and collection tool' \
            'Exec=pokecard' \
            'Terminal=false' \
            'Categories=Utility;Graphics;' \
            > pokecard.desktop

          cat > PKGBUILD <<'EOF'
          # Maintainer: willtryon
          pkgname=pokecard
          pkgver=${{ needs.check-version.outputs.version }}
          pkgrel=1
          pkgdesc="Pokemon card scanning and collection tool"
          arch=('x86_64')
          url="https://github.com/willtryon/PokeImageComp"
          license=('custom')
          depends=('java-runtime>=21' 'gtk3' 'gtk2' 'hicolor-icon-theme')
          source=('pokecard.jar' 'pokecard.sh' 'pokecard.desktop')
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm644 "$srcdir/pokecard.jar"     "$pkgdir/usr/share/java/pokecard/pokecard.jar"
              install -Dm755 "$srcdir/pokecard.sh"      "$pkgdir/usr/bin/pokecard"
              install -Dm644 "$srcdir/pokecard.desktop" "$pkgdir/usr/share/applications/pokecard.desktop"
          }
          EOF

      - name: Build package with makepkg in an Arch container
        run: |
          docker run --rm -v "$PWD/arch:/work" archlinux:base-devel bash -c '
            useradd -m builder &&
            chown -R builder:builder /work &&
            runuser -u builder -- bash -lc "cd /work && makepkg -f --nodeps"
          '
          # docker wrote files as a different uid; reclaim them so later steps can read them
          sudo chown -R "$(id -u):$(id -g)" arch

      - name: Upload pacman package
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-arch
          path: arch/*.pkg.tar.zst

  create-release:
    needs: [check-version, build-jars, build-macos-app, build-windows, build-linux-packages, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Pokecard v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/pokecard-jar-*/*.jar
            artifacts/pokecard-macos-app/*.zip
            artifacts/pokecard-windows-app/*.zip
            artifacts/pokecard-rpm/*.rpm
            artifacts/pokecard-deb/*.deb
            artifacts/pokecard-arch/*.pkg.tar.zst