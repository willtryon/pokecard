name: Release

on:
  pull_request:
    types: [closed]
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the version out of pom.xml (the single source of truth) and makes
  # sure we're not about to re-publish a release that already exists - if
  # this fails, bump <version> in pom.xml as part of the PR you're merging.
  check-version:
    ##if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Read project version from pom.xml
        id: version
        run: echo "version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"

      - name: Fail if this version was already released
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "::error::v${{ steps.version.outputs.version }} already has a release. Bump <version> in pom.xml before merging to master."
            exit 1
          fi

  # One lean jar per platform. -Djavacpp.platform prunes OpenCV natives to a
  # single OS; JavaFX natives are pruned automatically by building on the
  # matching native runner.
  build-jars:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            label: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
            label: windows-x86_64
          - os: macos-latest        # macos-latest is Apple Silicon (arm64)
            platform: macosx-arm64
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build platform-restricted jar
        run: mvn -B clean package -Djavacpp.platform=${{ matrix.platform }} --file pom.xml

      - name: Name the jar for its platform
        shell: bash          # windows-latest defaults to pwsh; force bash for the cp
        run: |
          cp target/pokecard-${{ needs.check-version.outputs.version }}.jar \
             pokecard-${{ needs.check-version.outputs.version }}-${{ matrix.label }}.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-jar-${{ matrix.label }}
          path: pokecard-${{ needs.check-version.outputs.version }}-${{ matrix.label }}.jar

  build-macos-app:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar with Maven
        run: mvn -B clean package -Djavacpp.platform=macosx-arm64 --file pom.xml

      - name: Package pokecard.app with jpackage
        run: |
          jpackage \
            --type app-image \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version 1.0 \
            --vendor willtryon

      - name: Zip the app bundle
        run: cd dist && zip -r -X pokecard-${{ needs.check-version.outputs.version }}-macos.zip pokecard.app

      - name: Upload app-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-macos-app
          path: dist/pokecard-${{ needs.check-version.outputs.version }}-macos.zip

  # Windows app image, zipped. jpackage --type app-image needs no external
  # tooling (unlike --type msi, which on JDK 21 requires WiX 3.x). The user
  # unzips and runs pokecard.exe. See notes below the file for the MSI variant.
  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build jar with Maven
        run: mvn -B clean package -Djavacpp.platform=windows-x86_64 --file pom.xml

      - name: Package app image with jpackage
        run: |                       # pwsh: line continuation is a backtick, not a backslash
          jpackage `
            --type app-image `
            --input target `
            --dest dist `
            --name pokecard `
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar `
            --main-class com.willtryon.pokecard.gui.Launcher `
            --app-version ${{ needs.check-version.outputs.version }} `
            --vendor willtryon

      - name: Zip the app image
        run: Compress-Archive -Path dist/pokecard -DestinationPath dist/pokecard-${{ needs.check-version.outputs.version }}-windows.zip

      - name: Upload windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-windows-app
          path: dist/pokecard-${{ needs.check-version.outputs.version }}-windows.zip

  # Builds the jar once, then emits both .rpm and .deb from it.
  build-linux-packages:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # rpm -> rpmbuild;  fakeroot -> required by jpackage's deb packaging
      - name: Install rpm + deb packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm createrepo-c fakeroot

      - name: Build jar with Maven
        run: mvn -B clean package -Djavacpp.platform=linux-x86_64 --file pom.xml

      - name: Package .rpm with jpackage
        run: |
          jpackage \
            --type rpm \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version ${{ needs.check-version.outputs.version }} \
            --vendor willtryon \
            --linux-package-name pokecard \
            --description "Pokecard - Pokemon card scanning and collection tool"

      - name: Package .deb with jpackage
        run: |
          jpackage \
            --type deb \
            --input target \
            --dest dist \
            --name pokecard \
            --main-jar pokecard-${{ needs.check-version.outputs.version }}.jar \
            --main-class com.willtryon.pokecard.gui.Launcher \
            --app-version ${{ needs.check-version.outputs.version }} \
            --vendor willtryon \
            --linux-package-name pokecard \
            --description "Pokecard - Pokemon card scanning and collection tool"

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-rpm
          path: dist/*.rpm

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokecard-deb
          path: dist/*.deb

  create-release:
    needs: [check-version, build-jars, build-macos-app, build-windows, build-linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Pokecard v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/pokecard-jar-*/*.jar
            artifacts/pokecard-macos-app/*.zip
            artifacts/pokecard-windows-app/*.zip
            artifacts/pokecard-rpm/*.rpm
            artifacts/pokecard-deb/*.deb

  publish-rpm-repo:
    needs: [build-linux-packages, create-release]
    runs-on: ubuntu-latest
    concurrency:
      group: pokecard-rpm-repo-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download rpm artifact
        uses: actions/download-artifact@v5
        with:
          name: pokecard-rpm
          path: staging

      - name: Check out existing repo, if one exists yet
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-old

      - name: Assemble repo directory
        run: |
          mkdir -p repo/rpm
          if [ -d gh-pages-old/rpm ]; then
            cp gh-pages-old/rpm/*.rpm repo/rpm/ 2>/dev/null || true
          fi
          cp staging/*.rpm repo/rpm/

      - name: Install createrepo_c
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Generate repodata
        run: createrepo_c --update repo/rpm

      - name: Write .repo file
        run: |
          cat > repo/rpm/pokecard.repo << 'EOF'
          [pokecard]
          name=Pokecard
          baseurl=https://willtryon.github.io/pokecard/rpm/
          enabled=1
          gpgcheck=0
          EOF

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          keep_files: true